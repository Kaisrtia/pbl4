name: "Lint PR Title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Định nghĩa các loại type hợp lệ theo CONTRIBUTING.md và Conventional Commits
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
            build
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Tiêu đề PR phải bắt đầu bằng chữ thường sau dấu hai chấm. Ví dụ: feat(target-app): add login endpoint"
